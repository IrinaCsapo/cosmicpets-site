name: Deploy to GitHub Pages

# Deploys on every push to main, and on demand from the Actions tab.
#
# configure-pages runs with `enablement: true`, so the first run switches Pages
# on by itself. There is no need to visit Settings > Pages first.
#
# REMAINING LAUNCH STEP: rename CNAME.disabled to CNAME once the DNS records in
# the README point at GitHub. Until then the site lives at
# https://irinacsapo.github.io/cosmicpets-site/ and cosmicpets.co.uk is
# untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
