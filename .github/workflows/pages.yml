name: Deploy to GitHub Pages

# Deploys on every push to main, and on demand from the Actions tab.
#
# ONE-TIME SETUP, required before the first run can succeed:
#   Settings > Pages > Source: GitHub Actions
#
# This cannot be automated. configure-pages accepts `enablement: true`, which
# is meant to create the Pages site over the API, but the workflow's GITHUB_TOKEN
# is refused: "Create Pages site failed. Resource not accessible by integration".
# So the dropdown has to be set by hand, once.
#
# REMAINING LAUNCH STEP: rename CNAME.disabled to CNAME once the DNS records in
# the README point at GitHub. Until then the site lives at
# https://irinacsapo.github.io/cosmicpets-site/ and cosmicpets.co.uk is
# untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
